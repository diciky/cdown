<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>CDown - 极速多线程下载器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" width="28" height="28" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#lg)"/>
        <path d="M24 13 v16" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M15.5 22.5 L24 31 L32.5 22.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M15 36.5 h18" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>
        <path d="M10 9.5 h8 M10 14.5 h5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".6"/>
      </svg>
      CDown <span class="sub">极速多线程下载器</span>
    </div>
    <div class="actions">
      <button id="btn-pause-all" class="ghost" title="全部暂停">⏸ 全部暂停</button>
      <button id="btn-settings" class="ghost" title="设置">⚙ 设置</button>
    </div>
  </header>

  <section class="addbar">
    <input id="url-input" type="text" placeholder="粘贴下载链接：HTTP(S) 直链 / m3u8 / B站·YouTube·X 等视频页 / HuggingFace 模型文件…  回车添加" />
    <input id="threads-input" type="number" min="1" max="64" value="32" title="线程数 (1-64)"
           list="thread-presets" style="width:110px" />
    <datalist id="thread-presets">
      <option value="4"></option><option value="8"></option><option value="16"></option>
      <option value="32"></option><option value="64"></option>
    </datalist>
    <button id="btn-sniff" class="ghost" title="嗅探网址，发现页面里的视频/音频/文件">🔍 嗅探</button>
    <button id="btn-add" class="primary">添加任务</button>
  </section>

  <nav class="tabs">
    <button class="tab active" data-filter="all">全部 <span id="count-all">0</span></button>
    <button class="tab" data-filter="active">进行中 <span id="count-active">0</span></button>
    <button class="tab" data-filter="completed">已完成 <span id="count-completed">0</span></button>
    <button class="tab" data-filter="error">出错 <span id="count-error">0</span></button>
    <div class="spacer"></div>
    <button id="btn-copy-links" class="ghost small" title="复制全部任务链接到剪贴板">🔗 复制全部链接</button>
    <button id="btn-export-links" class="ghost small" title="导出任务链接为文本文件">📤 导出链接</button>
    <button id="btn-clear-completed" class="ghost small">清空已完成</button>
  </nav>

  <main id="task-list" class="task-list"></main>

  <!-- 剪贴板检测弹窗 -->
  <div id="clipboard-modal" class="modal hidden">
    <div class="modal-body">
      <h3>📋 检测到剪贴板下载链接</h3>
      <div id="clipboard-url" class="cb-url"></div>
      <label>线程数 (1-64)</label>
      <input id="cb-threads" type="number" min="1" max="64" value="32" />
      <div class="modal-actions">
        <button id="btn-cb-ignore" class="ghost">忽略</button>
        <button id="btn-cb-add" class="primary">添加任务</button>
      </div>
    </div>
  </div>

  <!-- 网址嗅探弹窗 -->
  <div id="sniff-modal" class="modal hidden">
    <div class="modal-body sniff-body">
      <h3>🔍 网址嗅探 - 发现可下载文件</h3>
      <div class="row">
        <input id="sniff-url" type="text" placeholder="输入任意网页地址：视频页 / 资源页 / m3u8 …" />
        <button id="btn-sniff-go" class="primary">嗅探</button>
      </div>
      <div id="sniff-status" class="dim" style="font-size:12px;color:var(--text2)"></div>
      <div id="sniff-results" class="sniff-results"></div>
      <div class="row sniff-ops">
        <label class="check-row" style="margin-top:0"><input id="sniff-checkall" type="checkbox" checked /> 全选</label>
        <span style="flex:1"></span>
        <span style="font-size:12px;color:var(--text2)">线程</span>
        <input id="sniff-threads" type="number" min="1" max="64" value="32" style="width:78px" />
        <button id="btn-sniff-download" class="primary" disabled>下载所选</button>
      </div>
      <div class="modal-actions">
        <button id="btn-sniff-close" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-body">
      <h3>设置</h3>
      <label>下载目录</label>
      <div class="row"><input id="cfg-dir" type="text" readonly /><button id="btn-choose-dir" class="ghost">选择…</button></div>
      <label>单任务最大线程数 (1-64)</label>
      <input id="cfg-threads" type="number" min="1" max="64" />
      <label>同时下载任务数</label>
      <input id="cfg-concurrent" type="number" min="1" max="10" />
      <label class="check-row"><input id="cfg-clipboard" type="checkbox" /> 自动识别剪贴板链接并询问添加</label>
      <div class="about">CDown v0.2.3 · 开发者 <b>diciky</b> · <a href="mailto:diciky.zl@gmail.com" style="color:var(--primary)">diciky.zl@gmail.com</a> · MIT License</div>
      <div class="modal-actions">
        <button id="btn-settings-cancel" class="ghost">取消</button>
        <button id="btn-settings-save" class="primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
